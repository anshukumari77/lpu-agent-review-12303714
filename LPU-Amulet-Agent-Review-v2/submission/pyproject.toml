[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amulet-beep-agent"
version = "0.1.0"
description = "Evidence-led autonomous workflow reviews"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.6,<3", "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "openai>=2.54,<3", "livekit-agents[openai,silero]>=1.3,<2", "livekit-api>=1,<2",
  "pillow>=11,<13", "jinja2>=3.1,<4", "httpx>=0.28,<1", "aiohttp>=3.12,<4",
  "itsdangerous>=2.2,<3", "boto3>=1.35,<2", "pyyaml>=6,<7",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1,<2"]
[project.scripts]
beep-api = "beep_agent.api:main"
beep-worker = "beep_agent.worker:main"
beep-realtime = "beep_agent.realtime:main"
[tool.hatch.build.targets.wheel]
packages = ["src/beep_agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
